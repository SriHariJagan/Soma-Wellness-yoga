<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Child practicing tree pose in a playful kids yoga session">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FA8112"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#F3EBDD"/>
      <stop offset="1" stop-color="#FFF9F0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="#FFF9F0"/>
  <rect width="400" height="500" fill="url(#glow)"/>

  <circle cx="48" cy="70" r="3" fill="#FA8112" opacity="0.5"/>
  <circle cx="352" cy="60" r="2.5" fill="#FB923C" opacity="0.6"/>
  <circle cx="60" cy="430" r="2.5" fill="#FA8112" opacity="0.4"/>
  <circle cx="340" cy="440" r="3" fill="#FB923C" opacity="0.5"/>

  <circle cx="200" cy="255" r="178" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.45"/>
  <circle cx="200" cy="255" r="190" fill="none" stroke="#FA8112" stroke-width="1" opacity="0.25" stroke-dasharray="3 8"/>

  <!-- sun -->
  <g transform="translate(84,86)">
    <circle r="26" fill="#FA8112"/>
    <g stroke="#FA8112" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-34" x2="0" y2="-44"/>
      <line x1="24" y1="-24" x2="31" y2="-31"/>
      <line x1="34" y1="0" x2="44" y2="0"/>
      <line x1="24" y1="24" x2="31" y2="31"/>
      <line x1="0" y1="34" x2="0" y2="44"/>
      <line x1="-24" y1="24" x2="-31" y2="31"/>
      <line x1="-34" y1="0" x2="-44" y2="0"/>
      <line x1="-24" y1="-24" x2="-31" y2="-31"/>
    </g>
  </g>

  <!-- stars -->
  <g fill="#FB923C" opacity="0.9">
    <path d="M322 168 l4 -11 4 11 -11 -4 14 0 z"/>
    <path d="M64 332 l3 -8 3 8 -8 -3 10 0 z" fill="#FA8112" opacity="0.7"/>
    <path d="M330 330 l3 -8 3 8 -8 -3 10 0 z" opacity="0.6"/>
  </g>

  <!-- child in tree pose -->
  <g fill="#2D1406">
    <circle cx="200" cy="160" r="15"/>
    <path d="M189 177 C189 195, 186 208, 186 220 L214 220 C214 208, 211 195, 211 177 C204 183, 196 183, 189 177 Z"/>
    <rect x="196" y="222" width="8" height="70" rx="4"/>
    <rect x="162" y="224" width="34" height="8" rx="4" transform="rotate(24 179 228)"/>
    <rect x="158" y="230" width="8" height="40" rx="4" transform="rotate(9 162 250)"/>
    <rect x="185" y="152" width="8" height="44" rx="4" transform="rotate(-32 189 174)"/>
    <rect x="207" y="152" width="8" height="44" rx="4" transform="rotate(32 211 174)"/>
  </g>

  <!-- leaves / branches -->
  <circle cx="176" cy="114" r="8" fill="#FA8112"/>
  <circle cx="224" cy="114" r="8" fill="#FA8112"/>
  <path d="M214 128 q6 -8 12 -2 q-7 4 -12 2 Z" fill="#FB923C"/>
  <path d="M186 128 q-6 -8 -12 -2 q7 4 12 2 Z" fill="#FB923C"/>

  <!-- falling leaves -->
  <g fill="#FB923C" opacity="0.85">
    <path d="M142 300 q6 -9 13 -3 q-8 4 -13 3 Z"/>
    <path d="M262 322 q5 -8 11 -2 q-7 4 -11 2 Z"/>
    <path d="M150 356 q4 -7 9 -2 q-6 3 -9 2 Z" fill="#FA8112"/>
    <circle cx="266" cy="292" r="3" fill="#FA8112"/>
  </g>

  <!-- ground -->
  <ellipse cx="200" cy="296" rx="58" ry="7" fill="#F3EBDD"/>
  <path d="M96 296 q26 -14 52 0 t52 0 t52 0 t52 0 t52 0" fill="none" stroke="#FA8112" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
</svg>
