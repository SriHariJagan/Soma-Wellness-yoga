<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="One-to-one personal yoga training, instructor guiding a student in lotus pose">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FA8112"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#F3EBDD"/>
      <stop offset="1" stop-color="#FFF9F0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="#FFF9F0"/>
  <rect width="400" height="500" fill="url(#glow)"/>

  <circle cx="52" cy="72" r="3" fill="#FA8112" opacity="0.5"/>
  <circle cx="330" cy="58" r="2.5" fill="#FB923C" opacity="0.6"/>
  <circle cx="362" cy="418" r="3" fill="#FA8112" opacity="0.4"/>
  <circle cx="45" cy="430" r="2.5" fill="#FB923C" opacity="0.5"/>
  <circle cx="296" cy="472" r="2" fill="#2D1406" opacity="0.3"/>
  <circle cx="122" cy="300" r="2.5" fill="#2D1406" opacity="0.25"/>

  <circle cx="200" cy="255" r="178" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.45"/>
  <circle cx="200" cy="255" r="190" fill="none" stroke="#FA8112" stroke-width="1" opacity="0.25" stroke-dasharray="3 8"/>

  <circle cx="200" cy="255" r="150" fill="none" stroke="#FA8112" stroke-width="1" opacity="0.14" stroke-dasharray="1 12"/>

  <!-- seated student in lotus pose -->
  <g fill="#2D1406">
    <circle cx="150" cy="172" r="17"/>
    <path d="M138 190 C138 207, 135 219, 135 228 L165 228 C165 219, 162 207, 162 190 C155 196, 145 196, 138 190 Z"/>
    <circle cx="125" cy="232" r="11"/>
    <circle cx="175" cy="232" r="11"/>
    <ellipse cx="150" cy="252" rx="32" ry="13"/>
    <circle cx="150" cy="218" r="4.5"/>
  </g>

  <!-- instructor guiding -->
  <g fill="#2D1406">
    <circle cx="268" cy="170" r="17"/>
    <path d="M255 190 C255 208, 252 222, 252 234 L284 234 C284 222, 281 208, 281 190 C274 196, 262 196, 255 190 Z"/>
    <rect x="253" y="236" width="9" height="58" rx="4.5"/>
    <rect x="271" y="236" width="9" height="58" rx="4.5"/>
    <rect x="196" y="200" width="58" height="9" rx="4.5" transform="rotate(16 225 204)"/>
    <rect x="262" y="198" width="46" height="9" rx="4.5" transform="rotate(-50 285 202)"/>
    <circle cx="205" cy="206" r="6"/>
  </g>

  <!-- guidance connection -->
  <path d="M206 212 C 226 236, 184 262, 200 292" fill="none" stroke="#FA8112" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <path d="M197 298 l4 -11 4 11 -11 -4 14 0 z" fill="#FA8112"/>
  <path d="M316 116 l5 -12 5 12 -12 -5 14 0 z" fill="#FB923C"/>

  <!-- sun arc -->
  <path d="M56 158 a40 40 0 0 1 80 0" fill="none" stroke="#FA8112" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <circle cx="96" cy="114" r="3" fill="#FA8112" opacity="0.7"/>

  <!-- small lotus accent -->
  <g fill="#FA8112" opacity="0.85">
    <path d="M16 440 C6 428, 8 414, 16 414 C24 414, 26 428, 16 440 Z"/>
    <path d="M16 440 C6 428, 8 414, 16 414 C24 414, 26 428, 16 440 Z" transform="rotate(-35 16 424)"/>
    <path d="M16 440 C6 428, 8 414, 16 414 C24 414, 26 428, 16 440 Z" transform="rotate(35 16 424)"/>
    <path d="M16 444 L16 458" stroke="#FA8112" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
  <ellipse cx="16" cy="440" rx="14" ry="5" fill="#F3EBDD" stroke="#FA8112" stroke-width="1.5" opacity="0.6"/>
</svg>
