<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Two children playing yoga poses together with a yoga ball">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FA8112"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#F3EBDD"/>
      <stop offset="1" stop-color="#FFF9F0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="#FFF9F0"/>
  <rect width="400" height="500" fill="url(#glow)"/>

  <circle cx="52" cy="66" r="3" fill="#FA8112" opacity="0.5"/>
  <circle cx="350" cy="56" r="2.5" fill="#FB923C" opacity="0.6"/>
  <circle cx="58" cy="436" r="2.5" fill="#FA8112" opacity="0.4"/>
  <circle cx="342" cy="446" r="3" fill="#FB923C" opacity="0.5"/>

  <circle cx="200" cy="252" r="178" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.45"/>
  <circle cx="200" cy="252" r="190" fill="none" stroke="#FA8112" stroke-width="1" opacity="0.25" stroke-dasharray="3 8"/>

  <!-- sun -->
  <g transform="translate(74,80)">
    <circle r="24" fill="#FA8112"/>
    <g stroke="#FA8112" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-32" x2="0" y2="-42"/>
      <line x1="23" y1="-23" x2="30" y2="-30"/>
      <line x1="32" y1="0" x2="42" y2="0"/>
      <line x1="23" y1="23" x2="30" y2="30"/>
      <line x1="0" y1="32" x2="0" y2="42"/>
      <line x1="-23" y1="23" x2="-30" y2="30"/>
      <line x1="-32" y1="0" x2="-42" y2="0"/>
      <line x1="-23" y1="-23" x2="-30" y2="-30"/>
    </g>
  </g>

  <!-- stars -->
  <g fill="#FB923C">
    <path d="M324 140 l4 -11 4 11 -11 -4 14 0 z"/>
    <path d="M330 360 l3 -8 3 8 -8 -3 10 0 z" opacity="0.6"/>
    <path d="M56 340 l3 -8 3 8 -8 -3 10 0 z" opacity="0.7"/>
  </g>

  <!-- kid A: seated butterfly pose -->
  <g fill="#2D1406">
    <circle cx="118" cy="192" r="14"/>
    <path d="M109 207 C109 221, 107 232, 107 240 L129 240 C129 232, 127 221, 127 207 C121 212, 115 212, 109 207 Z"/>
    <circle cx="92" cy="246" r="9.5"/>
    <circle cx="144" cy="246" r="9.5"/>
    <ellipse cx="118" cy="262" rx="27" ry="11"/>
    <rect x="96" y="240" width="22" height="7" rx="3.5" transform="rotate(24 107 243)"/>
    <rect x="118" y="240" width="22" height="7" rx="3.5" transform="rotate(-24 129 243)"/>
  </g>

  <!-- kid B: standing star pose -->
  <g fill="#2D1406">
    <circle cx="282" cy="166" r="14"/>
    <path d="M273 181 C273 196, 271 208, 271 216 L293 216 C293 208, 291 196, 291 181 C285 186, 279 186, 273 181 Z"/>
    <rect x="271" y="218" width="7" height="52" rx="3.5" transform="rotate(-12 274 244)"/>
    <rect x="286" y="218" width="7" height="52" rx="3.5" transform="rotate(12 289 244)"/>
    <rect x="268" y="196" width="40" height="7" rx="3.5" transform="rotate(-42 288 199)"/>
    <rect x="256" y="196" width="40" height="7" rx="3.5" transform="rotate(42 276 199)"/>
  </g>

  <!-- yoga ball between them -->
  <circle cx="200" cy="258" r="18" fill="#FFF9F0" stroke="#FA8112" stroke-width="3"/>
  <path d="M188 250 q6 -6 12 0 q6 6 12 0" fill="none" stroke="#FA8112" stroke-width="2" stroke-linecap="round"/>
  <path d="M186 266 q7 6 14 0" fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#FA8112" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M222 248 q10 -4 14 -12"/>
    <path d="M178 278 q-10 4 -14 12"/>
  </g>

  <!-- ground wave -->
  <path d="M60 322 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#FA8112" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <ellipse cx="118" cy="330" rx="42" ry="6" fill="#F3EBDD"/>
  <ellipse cx="282" cy="330" rx="42" ry="6" fill="#F3EBDD"/>
</svg>
